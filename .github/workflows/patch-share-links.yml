name: Patch hotel social share links

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-share-links.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Patch share URLs
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('api/hotel-v2.js')
          s=p.read_text(encoding='utf-8')
          marker="const PUBLIC_HOST = 'viajes.trhoncalhomes.com.mx';\n"
          if "const SHARE_VERSION" not in s:
              s=s.replace(marker, marker+"const SHARE_VERSION = 'wa-20260902b';\n",1)
          old="const previewUrl=`${requestProto(req)}://${requestHost(req)}/hotel-v2/${encodeURIComponent(slug)}${offer?`?oferta=${encodeURIComponent(offer.id)}`:''}`;"
          new="const canonicalShareUrl=`${requestProto(req)}://${requestHost(req)}/hotel-v2/${encodeURIComponent(slug)}${offer?`?oferta=${encodeURIComponent(offer.id)}`:''}`;\n  const previewUrl=`${canonicalShareUrl}${canonicalShareUrl.includes('?')?'&':'?'}share=${encodeURIComponent(SHARE_VERSION)}`;"
          if old not in s:
              raise SystemExit('previewUrl target not found')
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
          PY

      - name: Commit patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add api/hotel-v2.js
          if git diff --cached --quiet; then
            echo 'No changes.'
            exit 0
          fi
          git commit -m 'Share: add cache-busted URLs to hotel actions'
          git push origin HEAD:main
