name: QA Apps Script v11 syntax

on:
  push:
    branches: [main]
    paths:
      - 'apps-script/LeadSubmission.gs'
      - '.github/workflows/qa-apps-script-v11.yml'
  workflow_dispatch:

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate Apps Script JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          cp apps-script/LeadSubmission.gs /tmp/LeadSubmission.js
          node --check /tmp/LeadSubmission.js
          echo 'LeadSubmission.gs syntax OK'
