name: Build hotel social cards

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-social-cards.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Install Pillow
        run: python -m pip install --quiet pillow

      - name: Build 1200x630 social images
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageOps

          slugs = [
              'friendly-fun-vallarta',
              'barcelo-puerto-vallarta',
              'grand-decameron-bucerias',
          ]

          for slug in slugs:
              folder = Path('assets/images/hoteles') / slug
              src = folder / '01.jpg'
              dst = folder / 'social.jpg'
              with Image.open(src) as im:
                  im = im.convert('RGB')
                  card = ImageOps.fit(im, (1200, 630), method=Image.Resampling.LANCZOS, centering=(0.5, 0.5))
                  quality = 78
                  while True:
                      card.save(dst, 'JPEG', quality=quality, optimize=True, progressive=True, subsampling='4:2:0')
                      if dst.stat().st_size <= 260_000 or quality <= 62:
                          break
                      quality -= 4
                  print(slug, dst.stat().st_size, 'bytes', 'quality', quality)
          PY

      - name: Commit social cards
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/images/hoteles/*/social.jpg
          if git diff --cached --quiet; then
            echo 'No image changes.'
            exit 0
          fi
          git commit -m 'Assets: add optimized hotel social cards'
          git push origin HEAD:main
