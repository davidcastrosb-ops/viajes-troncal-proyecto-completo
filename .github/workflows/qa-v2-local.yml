name: QA local V2 bloqueadores

on:
  push:
    branches:
      - feature/destination-hubs-v2-2026-08-29
  workflow_dispatch:

jobs:
  blockers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - name: Regresiones P1 XSS y galerias
        run: npm run test:blockers
