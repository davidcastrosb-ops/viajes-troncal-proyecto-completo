name: QA local V2 bloqueadores

on:
  push:
    branches:
      - feature/destination-hubs-v2-2026-08-29
      - codex/cierre-funcional-mvp-2026-09
  workflow_dispatch:

jobs:
  blockers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Sintaxis JS modificada
        run: |
          node --check api/hotel-v2.js
          node --check api/offer.js
          node --check api/offer-pdf-v2.js
          node --check api/offer-pdf.js
          node --check assets/js/site.js
          node --check assets/js/v2-directories.js
          cp apps-script/Code.gs /tmp/Trhoncal-Code.js
          node --check /tmp/Trhoncal-Code.js
      - name: Regresiones P1 XSS, galerias y precios
        run: node --experimental-vm-modules --test tests/v2-blockers.test.mjs
