name: Add Arma tu viaje to offer actions
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/add-arma-offer-action.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Patch offer action block
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('api/offer.js')
          s=p.read_text(encoding='utf-8')
          old='<div><span class="eyebrow">¿Te gusta esta opción?</span><h2>Guárdala, compártela o cotízala</h2><p>Puedes enviársela a quien viaje contigo para decidir juntos sin perder la promoción.</p></div>'
          new='<div><span class="eyebrow">¿Te gusta esta opción?</span><h2>Guárdala, compártela o arma tu viaje</h2><p>Puedes enviársela a quien viaje contigo para decidir juntos sin perder la promoción.</p></div>'
          if old not in s:
              raise SystemExit('Expected offer action heading not found')
          s=s.replace(old,new,1)
          needle='          <a class="btn btn-soft" href="${esc(pdfUrl)}" download>Descargar PDF</a>\n'
          insert=needle+'          <a class="btn btn-soft" href="${esc(customQuoteUrl)}">Arma tu viaje</a>\n'
          if needle not in s:
              raise SystemExit('Expected PDF button not found')
          s=s.replace(needle,insert,1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Sanity check
        run: |
          node --check api/offer.js
          grep -q 'Guárdala, compártela o arma tu viaje' api/offer.js
          grep -q '>Arma tu viaje</a>' api/offer.js
          grep -q 'Quiero este viaje' api/offer.js
      - name: Commit change and remove temporary workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm .github/workflows/add-arma-offer-action.yml
          git add api/offer.js .github/workflows/add-arma-offer-action.yml
          git commit -m 'Offer actions: add Arma tu viaje CTA'
          git push
