name: Patch Apps Script v11 promotion links

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-apps-script-v11.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Patch Trhoncal promotion links in lead email
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          p = Path('apps-script/LeadSubmission.gs')
          s = p.read_text(encoding='utf-8')

          s = s.replace(
              ' * v10: hotel + promo estable por Oferta_ID; correo principal + copia de respaldo.',
              ' * v11: correo con micrositio Trhoncal real + promo proveedor + origen de solicitud.'
          )

          helper = r'''function trhoncalPromoUrlForLead_(offerId) {
            const id = cleanLead_(offerId, 120);
            if (!id) return '';

            try {
              const ss = SpreadsheetApp.openById(CONFIG.spreadsheetId);
              const offersSheetName =
                CONFIG && CONFIG.sheets && CONFIG.sheets.offers
                  ? CONFIG.sheets.offers
                  : '07_Ofertas_Vigentes';
              const hotelsSheetName =
                CONFIG && CONFIG.sheets && CONFIG.sheets.hotels
                  ? CONFIG.sheets.hotels
                  : '21_Hoteles_Maestro';

              const offersSheet = ss.getSheetByName(offersSheetName);
              const hotelsSheet = ss.getSheetByName(hotelsSheetName);
              if (!offersSheet || !hotelsSheet) return '';

              const offerValues = offersSheet.getDataRange().getDisplayValues();
              if (offerValues.length < 2) return '';

              const offerHeaders = offerValues[0].map(function(value) {
                return String(value || '').trim();
              });
              const offerIdIndex = offerHeaders.indexOf('Oferta_ID');
              const hotelIdIndex = offerHeaders.indexOf('Hotel_ID');
              if (offerIdIndex < 0 || hotelIdIndex < 0) return '';

              let hotelId = '';
              for (let i = 1; i < offerValues.length; i++) {
                if (cleanLead_(offerValues[i][offerIdIndex], 120) !== id) continue;
                hotelId = cleanLead_(offerValues[i][hotelIdIndex], 120);
                break;
              }
              if (!hotelId) return '';

              const hotelValues = hotelsSheet.getDataRange().getDisplayValues();
              if (hotelValues.length < 2) return '';

              const hotelHeaders = hotelValues[0].map(function(value) {
                return String(value || '').trim();
              });
              const hotelKeyIndex = hotelHeaders.indexOf('Hotel_ID');
              const slugIndex = hotelHeaders.indexOf('Slug_Hotel');
              if (hotelKeyIndex < 0 || slugIndex < 0) return '';

              let slug = '';
              for (let i = 1; i < hotelValues.length; i++) {
                if (cleanLead_(hotelValues[i][hotelKeyIndex], 120) !== hotelId) continue;
                slug = cleanLead_(hotelValues[i][slugIndex], 160);
                break;
              }
              if (!slug) return '';

              return 'https://viajes.trhoncalhomes.com.mx/hotel-v2/' +
                encodeURIComponent(slug) +
                '?oferta=' + encodeURIComponent(id);
            } catch (error) {
              console.warn('No se pudo construir URL Trhoncal para la oferta', error);
              return '';
            }
          }

          '''

          marker = 'function notifyLead_(lead, leadId) {'
          if 'function trhoncalPromoUrlForLead_(offerId)' not in s:
              if marker not in s:
                  raise SystemExit('notifyLead_ marker not found')
              s = s.replace(marker, helper + marker, 1)

          old = """    const hotelLabel = cleanLead_(lead.hotel, 140);\n    const promoPublic = safeProviderPromoLead_(lead.promoUrl);"""
          new = """    const hotelLabel = cleanLead_(lead.hotel, 140);\n    const promoPublic = safeProviderPromoLead_(lead.promoUrl);\n    const trhoncalPromo = trhoncalPromoUrlForLead_(lead.ofertaId);"""
          if old in s and 'const trhoncalPromo = trhoncalPromoUrlForLead_' not in s:
              s = s.replace(old, new, 1)

          old_block = """      promoPublic\n        ? 'Promo proveedor: ' + promoPublic\n        : 'Promo proveedor: No disponible / pendiente de validar',\n      'CTA: ' + (lead.ctaOrigen || ''),\n      'URL Trhoncal: ' +\n        (lead.urlOrigen || ''),"""
          new_block = """      trhoncalPromo\n        ? 'Ver promoción en Trhoncal Travel: ' + trhoncalPromo\n        : 'Ver promoción en Trhoncal Travel: No disponible',\n      promoPublic\n        ? 'Referencia promoción proveedor: ' + promoPublic\n        : 'Referencia promoción proveedor: No disponible / pendiente de validar',\n      'CTA: ' + (lead.ctaOrigen || ''),\n      'Origen de la solicitud: ' +\n        (lead.urlOrigen || ''),"""
          if old_block not in s:
              raise SystemExit('email link block not found')
          s = s.replace(old_block, new_block, 1)

          required = [
              'v11: correo con micrositio Trhoncal real',
              'function trhoncalPromoUrlForLead_(offerId)',
              'Ver promoción en Trhoncal Travel:',
              'Referencia promoción proveedor:',
              'Origen de la solicitud:'
          ]
          for token in required:
              if token not in s:
                  raise SystemExit('missing required token: ' + token)

          p.write_text(s, encoding='utf-8')
          PY

      - name: Commit v11
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- apps-script/LeadSubmission.gs; then
            echo 'No changes required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps-script/LeadSubmission.gs
          git commit -m 'Apps Script v11: link lead emails to Trhoncal promotion microsite'
          git push origin HEAD:main
