name: Home commercial reorder

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/home-commercial-reorder.yml'

permissions:
  contents: write

jobs:
  reorder-home:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply controlled reorder
        run: python tools/home_commercial_reorder.py

      - name: Validate JavaScript
        run: |
          node --check assets/js/when-to-travel-v1.js
          node --check assets/js/promo-maker-v1.js

      - name: Commit changes
        run: |
          git config user.name 'davidcastrosb-ops'
          git config user.email 'davidcastrosb@gmail.com'
          git add index.html assets/js/when-to-travel-v1.js assets/js/promo-maker-v1.js assets/css/styles.css
          if git diff --cached --quiet; then
            echo 'No changes to commit'
            exit 0
          fi
          git commit -m 'Home: priorizar ofertas y WhatsApp'
          git push origin main
