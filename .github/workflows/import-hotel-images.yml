name: Import hotel images from Drive

on:
  push:
    branches:
      - feature/destination-hubs-v2-2026-08-29
    paths:
      - '.github/imports/hotel-images.json'

permissions:
  contents: write

jobs:
  import-images:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install image importer dependencies
        run: python -m pip install --disable-pip-version-check gdown pillow

      - name: Download and normalize hotel images
        run: |
          python - <<'PY'
          import json
          import tempfile
          from pathlib import Path
          import gdown
          from PIL import Image, ImageOps

          manifest_path = Path('.github/imports/hotel-images.json')
          data = json.loads(manifest_path.read_text(encoding='utf-8'))

          for hotel in data.get('hotels', []):
              slug = str(hotel['slug']).strip()
              if not slug or '/' in slug or '..' in slug:
                  raise ValueError(f'Invalid hotel slug: {slug!r}')

              dest_dir = Path('assets/images/hoteles') / slug
              dest_dir.mkdir(parents=True, exist_ok=True)

              # El manifiesto controla la galería completa de este hotel.
              # Se eliminan sólo imágenes numeradas antiguas; manifest.json se conserva.
              for old in dest_dir.iterdir():
                  if old.is_file() and old.stem.isdigit() and old.suffix.lower() in {'.jpg', '.jpeg', '.png', '.webp'}:
                      old.unlink()

              for item in hotel.get('files', []):
                  file_id = str(item['drive_file_id']).strip()
                  order = int(item['order'])
                  if order < 1 or order > 99:
                      raise ValueError(f'Invalid order {order} for {slug}')

                  with tempfile.TemporaryDirectory() as td:
                      raw_path = Path(td) / 'source'
                      downloaded = gdown.download(id=file_id, output=str(raw_path), quiet=False)
                      if not downloaded:
                          raise RuntimeError(f'Could not download Drive file {file_id}')

                      with Image.open(raw_path) as source:
                          image = ImageOps.exif_transpose(source).convert('RGB')
                          max_dim = 1600
                          if max(image.size) > max_dim:
                              scale = max_dim / max(image.size)
                              image = image.resize(
                                  (round(image.width * scale), round(image.height * scale)),
                                  Image.Resampling.LANCZOS,
                              )
                          target = dest_dir / f'{order:02d}.jpg'
                          image.save(target, 'JPEG', quality=86, optimize=True, progressive=True)
                          print(f'Wrote {target} {image.size}')
          PY

      - name: Commit imported images
        run: |
          git config user.name 'trhoncal-travel-bot'
          git config user.email 'davidcastrosb@gmail.com'
          git add assets/images/hoteles
          if git diff --cached --quiet; then
            echo 'No image changes to commit.'
            exit 0
          fi
          git commit -m 'Assets: importar galerías de hotel desde Drive'
          git push origin HEAD:${GITHUB_REF_NAME}
